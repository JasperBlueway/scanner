<!DOCTYPE html>
<html lang="nl"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#00587C">
<title>Scanner evenement</title>
<style>
/* BlueWay Design System: tokens en regels (oranje alleen als signaal, koppen teal, lijnen teal met lage dekking). */
:root{--bw-bg:#FAFAF8;--bw-white:#FFFFFF;--bw-text:#1A1A18;--bw-ink-70:rgba(26,26,24,.70);--bw-ink-50:rgba(26,26,24,.50);
--bw-teal-dark:#00587C;--bw-teal-dark-hover:#004A69;--bw-blue:#00B5E2;--bw-blue-soft:#E8F8FD;--bw-orange:#FF8C00;--bw-orange-hover:#E87D00;
--bw-line:rgba(0,88,124,.12);--bw-line-strong:rgba(0,88,124,.24);--bw-surface-sunken:#F2F4F3;
--bw-success:#1F8A5B;--bw-success-soft:#E6F4ED;--bw-warning-soft:#FFF1DF;--bw-warning-text:#8A4B00;--bw-danger:#C7362B;--bw-danger-soft:#FBEBE9;
--bw-radius-sm:8px;--bw-radius:10px;--bw-radius-lg:12px;--bw-shadow-sm:0 1px 2px rgba(0,0,0,.05);
--bw-focus-ring:0 0 0 3px rgba(0,181,226,.40);--bw-duration:180ms;--bw-ease:cubic-bezier(.2,0,.2,1);
--bw-font:"DM Sans",Carlito,Calibri,"Segoe UI",-apple-system,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bw-bg);color:var(--bw-text);font-family:var(--bw-font);font-size:16px;line-height:1.45}
.topbalk{height:6px;background:var(--bw-orange)}
header{padding:14px 16px 10px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--bw-blue)}
h1{font-size:20px;font-weight:700;margin:2px 0 0;line-height:1.25;color:var(--bw-teal-dark)}
.sub{color:var(--bw-ink-70);font-size:14px;margin-top:2px}
.proef{margin:0 16px 10px;background:var(--bw-warning-soft);border:1px solid rgba(255,140,0,.35);color:var(--bw-warning-text);border-radius:var(--bw-radius-sm);padding:8px 12px;font-size:14px}
.laden{margin:16px;color:var(--bw-ink-70)}
.foutblok{margin:16px;background:var(--bw-danger-soft);border:1px solid rgba(199,54,43,.30);color:var(--bw-danger);font-weight:700;border-radius:var(--bw-radius);padding:12px 14px}
.camera{position:relative;margin:0 auto;width:calc(100% - 32px);max-width:58vh;border-radius:var(--bw-radius-lg);overflow:hidden;background:var(--bw-teal-dark);aspect-ratio:1/1;box-shadow:var(--bw-shadow-sm)}
video{width:100%;height:100%;object-fit:cover;display:block}
.kader{position:absolute;inset:16%;border:3px solid var(--bw-white);border-radius:14px;box-shadow:0 0 0 999px rgba(0,88,124,.35);pointer-events:none}
.camfout{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center;color:rgba(255,255,255,.85);background:var(--bw-teal-dark)}
.camfout #camtekst{color:var(--bw-white)}
.camcode{font-size:12px;color:rgba(255,255,255,.60)}
#linkveld{width:100%;font:inherit;font-size:13px;padding:8px 10px;border-radius:var(--bw-radius-sm);border:0;color:var(--bw-text)}
.resultaat{margin:12px 16px;border-radius:var(--bw-radius);padding:14px 16px;background:var(--bw-white);border:1px solid var(--bw-line);min-height:76px;box-shadow:var(--bw-shadow-sm)}
.resultaat .kop{font-weight:700;font-size:17px;color:var(--bw-teal-dark)}
.resultaat .naam{margin-top:3px}
.resultaat.ok{background:var(--bw-success-soft);border-color:rgba(31,138,91,.35)}
.resultaat.ok .kop{color:var(--bw-success)}
.resultaat.let{background:var(--bw-warning-soft);border-color:rgba(255,140,0,.40)}
.resultaat.let .kop{color:var(--bw-warning-text)}
.resultaat.fout{background:var(--bw-danger-soft);border-color:rgba(199,54,43,.30)}
.resultaat.fout .kop{color:var(--bw-danger)}
.acties{display:flex;gap:8px;margin:0 16px;flex-wrap:wrap}
button{font:inherit;font-weight:700;font-size:15px;border:2px solid var(--bw-blue);background:transparent;color:var(--bw-teal-dark);border-radius:var(--bw-radius-sm);padding:9px 18px;cursor:pointer;transition:background var(--bw-duration) var(--bw-ease)}
button:hover{background:var(--bw-blue-soft)}
button:focus-visible,input:focus-visible{outline:none;box-shadow:var(--bw-focus-ring)}
button.primair{background:var(--bw-orange);border-color:var(--bw-orange);color:#fff}
button.primair:hover{background:var(--bw-orange-hover);border-color:var(--bw-orange-hover)}
.camfout button:not(.primair){color:var(--bw-white);border-color:var(--bw-blue)}
.camfout button:not(.primair):hover{background:rgba(255,255,255,.10)}
.zoek{margin:10px 16px 0;display:none}
.zoek input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--bw-line-strong);border-radius:var(--bw-radius-sm);background:var(--bw-white);color:var(--bw-text)}
.zoek ul{list-style:none;margin:6px 0 0;padding:0;background:var(--bw-white);border:1px solid var(--bw-line);border-radius:var(--bw-radius);max-height:40vh;overflow:auto}
.zoek li{padding:11px 12px;border-bottom:1px solid var(--bw-line);cursor:pointer}
.zoek li:hover{background:var(--bw-blue-soft)}
.zoek li:last-child{border-bottom:0}
.zoek li.leeg{color:var(--bw-ink-70);cursor:default}
.zoek li.leeg:hover{background:transparent}
.teller{margin:14px 16px 4px;color:var(--bw-ink-70);font-size:14px}
.log{margin:0 16px 24px;padding:0;list-style:none}
.log li{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--bw-line);font-size:14px}
.log .t{color:var(--bw-ink-70);white-space:nowrap}
</style></head><body>
<div class="topbalk"></div>
<div id="laden" class="laden">Scanner wordt geladen&hellip;</div>
<div id="foutblok" class="foutblok" hidden></div>
<div id="app" hidden>
<header><div class="eyebrow">Scanner evenement</div><h1 id="titel"></h1><div class="sub" id="sub"></div></header>
<div class="proef" id="proef" hidden>Proefmodus: scans worden gecontroleerd, maar nog niet in AFAS op aanwezig gezet.</div>
<div class="camera"><video id="video" playsinline muted autoplay></video><div class="kader"></div>
<div class="camfout" id="camfout"><div id="camtekst">De camera kan hier niet worden geopend.</div>
<button class="primair" id="nieuwvenster" type="button">Open scanner in nieuw venster</button>
<button id="kopieer" type="button">Kopieer link</button>
<input id="linkveld" type="text" readonly hidden>
<button id="opnieuw" type="button">Camera opnieuw proberen</button>
<div id="camcode" class="camcode"></div></div></div>
<div class="resultaat" id="resultaat"><div class="kop">Klaar om te scannen</div><div class="naam">Houd de QR-code uit AFAS Pocket in het kader.</div></div>
<div class="acties"><button type="button" id="zoekknop">Zoek op naam</button><button type="button" id="wissel" hidden>Andere camera</button></div>
<div class="zoek" id="zoek"><input id="zoekveld" type="search" placeholder="Typ een naam" autocomplete="off"><ul id="zoeklijst"></ul></div>
<div class="teller" id="teller"></div>
<ul class="log" id="log"></ul>
</div>
<canvas id="canvas" hidden></canvas>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
// Losse scanpagina voor de CSU scanmodule. n8n controleert het InSite-token en stuurt
// hierheen door met #s=<sessietoken>. Deze pagina draait niet op het n8n-adres, zodat
// de browser de camera wel toestaat (n8n schermt eigen HTML-pagina's af met een sandbox).
(function () {
  var API = 'https://blueway.n8p1.hostingsecure.com/webhook';

  function el(id) { return document.getElementById(id); }

  // Sessietoken uit de link halen en uit de adresbalk verwijderen. Het toestel onthoudt de
  // sessie (localStorage), zodat deze pagina daarna direct werkt tot de sessie in n8n verloopt.
  var SLEUTEL = 'csuScanToken';
  function bewaar(t) { try { localStorage.setItem(SLEUTEL, t); } catch (e) { try { sessionStorage.setItem(SLEUTEL, t); } catch (x) {} } }
  function vergeet() { try { localStorage.removeItem(SLEUTEL); } catch (e) {} try { sessionStorage.removeItem(SLEUTEL); } catch (e) {} }
  function lees() { try { return localStorage.getItem(SLEUTEL) || sessionStorage.getItem(SLEUTEL) || ''; } catch (e) { return ''; } }
  var token = '';
  try {
    var h = new URLSearchParams(location.hash.slice(1)).get('s') || '';
    if (/^[0-9a-f]{48}$/i.test(h)) {
      token = h.toLowerCase();
      bewaar(token);
      history.replaceState(null, '', location.pathname + location.search);
    } else {
      token = lees();
    }
  } catch (e) {}

  function fatale(melding) {
    el('laden').hidden = true; el('app').hidden = true;
    el('foutblok').hidden = false; el('foutblok').textContent = melding;
  }
  if (!token) { fatale('Geen scansessie gevonden. Open de scanner eenmalig vanuit AFAS InSite; daarna werkt deze pagina op dit toestel direct, tot het einde van de sessie.'); return; }

  function post(pad, body) {
    body.token = token;
    return fetch(API + pad, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().catch(function () { return { status: 'fout', melding: 'Onverwacht antwoord (HTTP ' + r.status + ').' }; }); });
  }

  post('/csu-scan/start', {}).then(function (D) {
    if (!D || D.status !== 'ok') { if (D && D.sessieVerlopen) vergeet(); fatale((D && D.melding) || 'De scanner kon niet worden gestart.'); return; }
    el('laden').hidden = true; el('app').hidden = false;
    start(D);
  }).catch(function () { fatale('Geen verbinding met de server. Probeer het opnieuw.'); });

  function start(D) {
    el('titel').textContent = D.titel;
    el('sub').textContent = 'Ingelogd als ' + D.scanner;
    if (D.proefmodus) el('proef').hidden = false;

    var video = el('video'), canvas = el('canvas');
    var ctx = canvas.getContext('2d', { willReadFrequently: true });
    var detector = null, stream = null, bezig = false, pauzeTot = 0, laatsteCode = '', laatsteTijd = 0, laatsteFrame = 0;
    var gescand = {}, aantalOk = 0, cams = [], camIndex = -1, gestopt = false;
    var inKader = true;
    try { inKader = window.self !== window.top; } catch (e) { inKader = true; }
    var afgeschermd = String(window.origin) === 'null';
    var link = location.origin + location.pathname + '#s=' + encodeURIComponent(token);

    function tijd() { var d = new Date(); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
    function toon(soort, kop, naam) {
      var r = el('resultaat');
      r.className = 'resultaat' + (soort ? ' ' + soort : '');
      r.innerHTML = '<div class="kop"></div><div class="naam"></div>';
      r.querySelector('.kop').textContent = kop;
      r.querySelector('.naam').textContent = naam || '';
    }
    function logRegel(soort, tekst) {
      var li = document.createElement('li'), a = document.createElement('span'), b = document.createElement('span');
      a.textContent = (soort === 'ok' ? '✓ ' : soort === 'let' ? '! ' : '✗ ') + tekst;
      b.className = 't'; b.textContent = tijd();
      li.appendChild(a); li.appendChild(b);
      var log = el('log'); log.insertBefore(li, log.firstChild);
      while (log.children.length > 30) log.removeChild(log.lastChild);
    }
    function teller() {
      el('teller').textContent = aantalOk + ' aanwezig gemeld op dit toestel' +
        (D.deelnemers.length ? ' · ' + D.deelnemers.length + ' deelnemers' : '');
    }
    function tril(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }
    function mdwUitCode(c) { var m = /^CSU1\.([A-Za-z0-9_-]{1,15})\.[0-9a-f]{20}$/i.exec(c); return m ? m[1] : null; }
    // Medewerkers uit Config herscanMedewerkers (bijv. testcodes) mogen zonder melding opnieuw.
    function magHerscan(mdw) { return (D.herscan || []).indexOf(mdw) >= 0; }
    function naamVan(mdw) { for (var i = 0; i < D.deelnemers.length; i++) if (D.deelnemers[i].m === mdw) return D.deelnemers[i].n; return ''; }

    function verstuur(body, label) {
      bezig = true;
      toon('', 'Bezig…', label || '');
      post('/csu-scan/scan', body).then(verwerk)
        .catch(function () { verwerk({ status: 'fout', melding: 'Geen verbinding. Probeer het opnieuw.' }); });
    }
    function verwerk(r) {
      var naam = r.naam || '';
      if (r.status === 'ok') {
        if (r.mdw) gescand[r.mdw] = tijd();
        aantalOk++; teller();
        toon('ok', r.proefmodus ? 'Gecontroleerd (proefmodus)' : 'Aanwezig gemeld', naam);
        logRegel('ok', naam || 'Aanwezig'); tril(80);
      } else if (r.status === 'al-aanwezig' || r.status === 'geblokkeerd') {
        if (r.status === 'al-aanwezig' && r.mdw) gescand[r.mdw] = gescand[r.mdw] || tijd();
        toon('let', r.melding, naam); logRegel('let', (naam ? naam + ': ' : '') + r.melding); tril([60, 60, 60]);
      } else {
        toon('fout', r.melding || 'Niet gelukt.', naam); logRegel('fout', (naam ? naam + ': ' : '') + (r.melding || 'Niet gelukt')); tril(250);
        if (r.sessieVerlopen) { vergeet(); gestopt = true; stop(); camFout(r.melding, false); }
      }
      bezig = false; pauzeTot = Date.now() + 1500;
    }
    function gevonden(code) {
      var nu = Date.now();
      if (code === laatsteCode && nu - laatsteTijd < 6000) return;
      laatsteCode = code; laatsteTijd = nu;
      var mdw = mdwUitCode(code);
      if (!mdw) { toon('fout', 'Onbekende QR-code', 'Dit is geen deelnemerscode voor dit evenement.'); logRegel('fout', 'Onbekende QR-code'); tril(250); pauzeTot = nu + 1500; return; }
      if (gescand[mdw] && !magHerscan(mdw)) { var n = naamVan(mdw); toon('let', 'Al gescand om ' + gescand[mdw], n); logRegel('let', (n ? n + ': ' : '') + 'al gescand'); tril([60, 60, 60]); pauzeTot = nu + 1500; return; }
      verstuur({ qr: code }, naamVan(mdw));
    }
    function lus() {
      setTimeout(lus, 180);
      var nu = Date.now();
      if (bezig || gestopt || nu < pauzeTot || !stream || video.readyState < 2) return;
      laatsteFrame = nu;
      if (detector) {
        bezig = true;
        detector.detect(video).then(function (res) { bezig = false; if (res && res.length) gevonden(res[0].rawValue); })
          .catch(function () { bezig = false; });
        return;
      }
      if (!window.jsQR) return;
      var w = video.videoWidth, h = video.videoHeight;
      if (!w || !h) return;
      var s = Math.min(1, 640 / Math.max(w, h));
      canvas.width = Math.round(w * s); canvas.height = Math.round(h * s);
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      var img = ctx.getImageData(0, 0, canvas.width, canvas.height);
      var c = window.jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
      if (c && c.data) gevonden(c.data);
    }

    function camFout(tekst, knoppen, code) {
      el('camtekst').textContent = tekst;
      el('nieuwvenster').hidden = knoppen === false;
      el('kopieer').hidden = knoppen === false;
      el('opnieuw').hidden = knoppen === false;
      el('camcode').textContent = code ? 'Reden: ' + code + ' · kader: ' + (inKader ? 'ja' : 'nee') + ' · afgeschermd: ' + (afgeschermd ? 'ja' : 'nee') : '';
      el('camfout').style.display = 'flex';
    }
    function stop() { if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; } }
    function startCamera() {
      if (gestopt) return;
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        camFout('Deze browser geeft hier geen toegang tot de camera. Open de scanner in een nieuw venster.'); return;
      }
      stop();
      var v = camIndex >= 0 && cams[camIndex] ? { deviceId: { exact: cams[camIndex].deviceId } } : { facingMode: { ideal: 'environment' } };
      navigator.mediaDevices.getUserMedia({ video: v, audio: false }).then(function (s) {
        stream = s; video.srcObject = s;
        var p = video.play(); if (p && p.catch) p.catch(function () {});
        el('camfout').style.display = 'none';
        navigator.mediaDevices.enumerateDevices().then(function (l) {
          cams = l.filter(function (d) { return d.kind === 'videoinput'; });
          el('wissel').hidden = cams.length < 2;
        }).catch(function () {});
      }).catch(function (e) {
        var n = (e && e.name) || 'onbekend';
        var geweigerd = n === 'NotAllowedError' || n === 'SecurityError';
        if (geweigerd && (inKader || afgeschermd)) {
          // InSite toont de pagina in een kader zonder cameratoestemming; toestemming geven kan hier niet.
          camFout('InSite staat de camera op deze pagina niet toe. Open de scanner in een nieuw venster; je blijft ingelogd.', true, n);
          el('opnieuw').hidden = true;
          return;
        }
        camFout(geweigerd
          ? 'Geen toegang tot de camera. Geef de browser toestemming voor de camera (slotje in de adresbalk) en probeer het opnieuw.'
          : n === 'NotFoundError' ? 'Geen camera gevonden op dit apparaat.' : 'De camera kon niet worden gestart.', true, n);
        el('nieuwvenster').hidden = true;
        el('kopieer').hidden = true;
      });
    }

    el('nieuwvenster').onclick = function () { window.open(link, '_blank', 'noopener'); };
    el('kopieer').onclick = function () {
      var veld = el('linkveld');
      veld.value = link; veld.hidden = false; veld.focus(); veld.select();
      var klaar = function () { el('kopieer').textContent = 'Link gekopieerd'; };
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(link).then(klaar, function () { try { if (document.execCommand('copy')) klaar(); } catch (x) {} });
        } else if (document.execCommand('copy')) { klaar(); }
      } catch (x) {}
    };
    el('opnieuw').onclick = startCamera;
    el('wissel').onclick = function () { if (cams.length) { camIndex = (camIndex + 1) % cams.length; startCamera(); } };

    function zoek() {
      var t = el('zoekveld').value.trim().toLowerCase(), ul = el('zoeklijst'), n = 0;
      ul.innerHTML = '';
      function leeg(tekst) { var li = document.createElement('li'); li.className = 'leeg'; li.textContent = tekst; ul.appendChild(li); }
      if (D.lijstFout) { leeg('De deelnemerslijst kon niet uit AFAS worden geladen.'); return; }
      for (var i = 0; i < D.deelnemers.length && n < 50; i++) {
        var d = D.deelnemers[i];
        if (t && d.n.toLowerCase().indexOf(t) < 0 && d.m.toLowerCase().indexOf(t) < 0) continue;
        n++;
        var li = document.createElement('li');
        li.textContent = d.n + (gescand[d.m] ? ' · al gescand ' + gescand[d.m] : '');
        li.onclick = (function (d) { return function () {
          if (gescand[d.m] && !magHerscan(d.m)) { toon('let', 'Al gescand om ' + gescand[d.m], d.n); return; }
          if (!window.confirm(d.n + ' op aanwezig zetten?')) return;
          el('zoek').style.display = 'none';
          verstuur({ mdw: d.m }, d.n);
        }; })(d);
        ul.appendChild(li);
      }
      if (!n) leeg('Geen deelnemer gevonden.');
    }
    el('zoekveld').oninput = zoek;
    el('zoekknop').onclick = function () {
      var z = el('zoek'), open = z.style.display !== 'block';
      z.style.display = open ? 'block' : 'none';
      if (open) { el('zoekveld').value = ''; zoek(); el('zoekveld').focus(); }
    };

    if ('BarcodeDetector' in window) {
      try {
        window.BarcodeDetector.getSupportedFormats().then(function (f) {
          if (f.indexOf('qr_code') >= 0) detector = new window.BarcodeDetector({ formats: ['qr_code'] });
        }).catch(function () {});
      } catch (e) {}
    }
    document.addEventListener('visibilitychange', function () { if (inKader) return; if (document.hidden) stop(); else startCamera(); });
    teller();
    if (inKader) {
      // InSite laadt deze pagina in een kader zonder cameratoestemming: meteen de knop tonen.
      el('nieuwvenster').textContent = 'Scanner openen';
      camFout('Open de scanner in een eigen venster. Daar werkt de camera; je blijft ingelogd.', true);
      el('opnieuw').hidden = true;
      el('kopieer').hidden = true;
    } else {
      startCamera();
    }
    lus();
  }
})();
</script></body></html>
